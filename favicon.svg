<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <!-- Edges -->
  <line x1="16" y1="10" x2="8"  y2="20" stroke="#d4953a" stroke-width="1.2" opacity="0.7"/>
  <line x1="16" y1="10" x2="24" y2="20" stroke="#7b80c0" stroke-width="1.2" opacity="0.7"/>
  <line x1="8"  y1="20" x2="24" y2="20" stroke="#4d9b6b" stroke-width="1.2" opacity="0.7"/>
  <line x1="16" y1="10" x2="16" y2="24" stroke="#d4953a" stroke-width="1.0" opacity="0.5"/>
  <!-- Central node (amber) -->
  <circle cx="16" cy="10" r="4" fill="#18181b" stroke="#d4953a" stroke-width="1.8"/>
  <circle cx="16" cy="10" r="1.8" fill="#d4953a"/>
  <!-- Left node (slate) -->
  <circle cx="8" cy="20" r="3" fill="#18181b" stroke="#7b80c0" stroke-width="1.5"/>
  <circle cx="8" cy="20" r="1.2" fill="#7b80c0"/>
  <!-- Right node (sage) -->
  <circle cx="24" cy="20" r="3" fill="#18181b" stroke="#4d9b6b" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="1.2" fill="#4d9b6b"/>
  <!-- Bottom node (amber dim) -->
  <circle cx="16" cy="24" r="2.5" fill="#18181b" stroke="#92672b" stroke-width="1.3"/>
  <circle cx="16" cy="24" r="1" fill="#92672b"/>
</svg>
